<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Station CTF</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #start { position: fixed; inset: 0; background: #0a0a12; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 100; }
        #start h1 { color: #00f0ff; font-size: 4em; margin: 0; }
        #start p { color: #ff00aa; font-size: 1.5em; margin: 10px 0 30px; }
        #start button { font-size: 1.5em; padding: 15px 50px; background: #00f0ff; border: none; cursor: pointer; }
        #hud { display: none; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="start">
        <h1>STATION CTF</h1>
        <p>Space Station Capture the Flag</p>
        <button id="btn">DEPLOY</button>
    </div>
    <div id="hud">
        <div style="position: fixed; top: 20px; left: 20px; color: #00ff88;">Health: <span id="hp">100</span></div>
        <div style="position: fixed; top: 20px; right: 20px; color: #3388ff;">Score: <span id="score">0</span></div>
    </div>
    <canvas id="game"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Debug - check if THREE loaded
        if (typeof THREE === 'undefined') {
            document.body.innerHTML = '<h1 style="color:red;padding:50px">Error: THREE.js failed to load. Check your internet connection.</h1>';
            throw new Error('THREE not loaded');
        }
        
        const btn = document.getElementById('btn');
        const startDiv = document.getElementById('start');
        const hudDiv = document.getElementById('hud');
        
        btn.onclick = function() {
            startDiv.style.display = 'none';
            hudDiv.style.display = 'block';
            initGame();
        };
        
        let camera, renderer;
        
        function initGame() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.FogExp2(0x000510, 0.02);
            
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Lights
            scene.add(new THREE.AmbientLight(0x112233, 0.5));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(50, 100, 50);
            scene.add(light);
            
            // Floor
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
            );
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);
            
            // Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f0f1a });
            const walls = [
                { pos: [0, 7.5, -60], rot: 0 },
                { pos: [0, 7.5, 60], rot: 0 },
                { pos: [-60, 7.5, 0], rot: Math.PI/2 },
                { pos: [60, 7.5, 0], rot: Math.PI/2 }
            ];
            walls.forEach(w => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(120, 15, 1), wallMat);
                wall.position.set(w.pos[0], w.pos[1], w.pos[2]);
                wall.rotation.y = w.rot;
                scene.add(wall);
            });
            
            // Central structure
            const center = new THREE.Mesh(
                new THREE.BoxGeometry(30, 12, 30),
                wallMat
            );
            center.position.set(0, 6, 0);
            scene.add(center);
            
            // Pillars
            const pillarPositions = [[-35,-35], [35,-35], [-35,35], [35,35], [-20,-20], [20,-20], [-20,20], [20,20]];
            pillarPositions.forEach(([x, z]) => {
                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.5, 1.5, 15, 8),
                    wallMat
                );
                pillar.position.set(x, 7.5, z);
                scene.add(pillar);
            });
            
            // Player
            const player = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3388ff, emissive: 0x3388ff, emissiveIntensity: 0.3 });
            player.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2, 8, 16), bodyMat).translateY(1.1));
            player.add(new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ color: 0x333344 })).translateY(2));
            player.position.set(40, 0, 0);
            scene.add(player);
            
            // Flags
            const redFlag = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 6),
                new THREE.MeshStandardMaterial({ color: 0xff3355 })
            );
            redFlag.position.set(-45, 3, 0);
            scene.add(redFlag);
            
            const blueFlag = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 6),
                new THREE.MeshStandardMaterial({ color: 0x3388ff })
            );
            blueFlag.position.set(45, 3, 0);
            scene.add(blueFlag);
            
            // Controls
            let yaw = 0, pitch = 0;
            const keys = {};
            document.addEventListener('keydown', e => keys[e.code] = true);
            document.addEventListener('keyup', e => keys[e.code] = false);
            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, pitch));
                }
            });
            document.addEventListener('click', () => document.body.requestPointerLock());
            
            // Game loop
            let hp = 100, score = 0;
            function animate() {
                requestAnimationFrame(animate);
                
                // Move player
                const speed = 0.3;
                if (keys['KeyW']) {
                    player.position.x -= Math.sin(yaw) * speed;
                    player.position.z -= Math.cos(yaw) * speed;
                }
                if (keys['KeyS']) {
                    player.position.x += Math.sin(yaw) * speed;
                    player.position.z += Math.cos(yaw) * speed;
                }
                if (keys['KeyA']) {
                    player.position.x -= Math.cos(yaw) * speed;
                    player.position.z += Math.sin(yaw) * speed;
                }
                if (keys['KeyD']) {
                    player.position.x += Math.cos(yaw) * speed;
                    player.position.z -= Math.sin(yaw) * speed;
                }
                
                // Clamp position
                player.position.x = Math.max(-55, Math.min(55, player.position.x));
                player.position.z = Math.max(-55, Math.min(55, player.position.z));
                
                // Update camera
                camera.position.copy(player.position).add(new THREE.Vector3(0, 1.5, 0));
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
                
                renderer.render(scene, camera);
            }
            animate();
        }
        
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
